ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [net.chrissearle.egg.ApplicationKt.module]
  }
}

egg {
  # The JSON Lines score store. A volume in the cluster; override when running
  # locally so a dev run cannot touch anything real.
  store = "/data/scores.jsonl"
  store = ${?EGG_STORE}

  # Where the exported game lives. The image copies it here; point this at
  # build/web to run against a local export.
  web = "/opt/app/web"
  web = ${?EGG_WEB}

  # The generated art the pages are built from — the font sheet and the banner
  # letters. The image copies assets/generated here; point this at that
  # directory in the repo to run locally.
  assets = "/opt/app/assets"
  assets = ${?EGG_ASSETS}
}
