name: Build

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GODOT_VERSION: 4.7.1-stable
  # Godot looks for templates in a directory named after the version it
  # reports, which drops the "-stable" and adds a dot.
  GODOT_TEMPLATE_DIR: 4.7.1.stable

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      short_sha_tag: ${{ steps.short_sha.outputs.short_sha_tag }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - uses: actions/checkout@v7.0.1

      - id: short_sha
        name: Compute short-sha tag
        run: echo "short_sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        name: Docker metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/egg
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

  # The web export runs once and is shared by both architecture builds: its
  # output is identical either way, and the export templates are a 1.2GB
  # download that there is no sense paying for twice.
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Godot export templates
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: |
          curl -sSLo godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # Only the web templates are kept. The archive carries every platform and
      # unpacks to about 2GB; the handful of web files are ~90MB, which is the
      # difference between a cache that restores in seconds and one that does
      # not. version.txt has to come too — Godot checks it.
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSLo templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          unzip -j -q templates.tpz 'templates/web*' 'templates/version.txt' \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"

      # The import pass is not optional: without it the project's global class
      # names are unresolved and the export fails on scripts it cannot compile.
      - name: Import project
        run: godot --headless --import

      - name: Export for web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Upload the exported game
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web
          retention-days: 1

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up tools
        uses: jdx/mise-action@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        working-directory: server
        run: ./gradlew clean check

      - name: Upload reports if failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            server/**/build/reports/
            server/**/build/test-results/

      - name: Upload coverage if passed
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            server/**/build/reports/jacoco/

  build-amd64:
    runs-on: ubuntu-latest
    needs: [meta, export, test]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/egg
      SHORT_SHA_TAG: ${{ needs.meta.outputs.short_sha_tag }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download the exported game
        uses: actions/download-artifact@v7
        with:
          name: web
          path: build/web

      - name: Generate build info resource
        run: echo "${SHORT_SHA_TAG}" > server/src/main/resources/image-tag.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ env.SHORT_SHA_TAG }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [meta, export, test]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/egg
      SHORT_SHA_TAG: ${{ needs.meta.outputs.short_sha_tag }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download the exported game
        uses: actions/download-artifact@v7
        with:
          name: web
          path: build/web

      - name: Generate build info resource
        run: echo "${SHORT_SHA_TAG}" > server/src/main/resources/image-tag.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ env.SHORT_SHA_TAG }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  manifest:
    runs-on: ubuntu-latest
    needs: [meta, build-amd64, build-arm64]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/egg
      SHORT_SHA_TAG: ${{ needs.meta.outputs.short_sha_tag }}
      TAGS: ${{ needs.meta.outputs.tags }}
      LABELS: ${{ needs.meta.outputs.labels }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifests for all tags
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              -t "$tag" \
              "${IMAGE_BASE}:${SHORT_SHA_TAG}-amd64" \
              "${IMAGE_BASE}:${SHORT_SHA_TAG}-arm64"
          done <<< "${TAGS}"

      - name: Create staging
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:staging" \
            "${IMAGE_BASE}:latest"

      - name: Generate summary
        run: |
          echo "Short SHA Tag: ${SHORT_SHA_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image base: ${IMAGE_BASE}" >> "$GITHUB_STEP_SUMMARY"
